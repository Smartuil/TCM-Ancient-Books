name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) 700 本 GB18030 纯文本 → public/data/*.json（约 2 分钟）
      - name: Compile corpus
        run: python3 scripts/build_data.py --src . --out public/data

      # 2) 全站全文检索索引：bigram 倒排 + 512 分片（约 2 分钟，147 MB，不入库）
      - name: Build full-text index
        run: python3 scripts/build_index.py --shards 512

      # 3) Astro 7 静态构建：701 个书目页 + 篇名检索页 + 首页（Astro 7 需要 Node >= 22.12）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
